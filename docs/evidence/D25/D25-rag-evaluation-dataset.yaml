# D25 RAG 起步评测数据集（固定问题与期望证据）
# 设计基线产物，非运行结果。问题文本固定，后续不得随意改写。
dataset:
  name: "D25 RAG 起步评测数据集"
  version: 1
  created: "2026-11-07"
  corpusSource: "src/main/resources/knowledge/equipment-fault-corpus.json"
  corpusFacts: "真实语料 3 文档 / 8 片段；无显式数字故障码、无租户/工厂权限字段"
  fixtureNotice: "权限用例中的测试主体与范围为测试夹具，不是真实用户或已生效权限策略；实际角色/租户映射待业务确认"
  metricsStatus: "未运行真实 RAG，命中率/Recall/MRR 等待后续实际评测，本文件不填数值"

# 类别取值：answerable / fault-code / unanswerable / permission / boundary
# 判定取值：answer / abstain / deny / clarify
# 来源状态：真实资料支持 / 当前缺少资料 / 待业务确认

